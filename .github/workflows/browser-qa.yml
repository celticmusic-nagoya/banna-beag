name: Browser QA
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved photo assets from uploaded archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          names=['hero-session','community','street-performance','festival','outdoor-community']
          with zipfile.ZipFile('banna-beag-optimized-images.zip') as z:
              for name in names:
                  matches=[i for i in z.infolist() if Path(i.filename).name==name+'.webp']
                  assert len(matches)==1, (name,len(matches))
                  assert matches[0].file_size < 5000000
                  p=Path('assets')/(name+'.webp')
                  p.parent.mkdir(exist_ok=True)
                  p.write_bytes(z.read(matches[0]))
          PY
      - name: Verify approved photo assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['hero-session','community','street-performance','festival','outdoor-community']:
              p=Path('assets')/(name+'.webp')
              assert p.is_file(), f'Missing approved image: {p}'
              data=p.read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', f'Invalid WebP: {p}'
          PY
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch();
            for(const width of [320,390,768,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('http://localhost:8765/');
              assert.equal(response.status(),200);
              assert.equal(await page.locator('h1').count(),1);
              const hero=await page.request.get('http://localhost:8765/assets/hero-session.webp');
              assert.equal(hero.status(),200);
              assert(await page.evaluate(async()=>{const i=new Image();i.src='assets/hero-session.webp';await i.decode();return i.naturalWidth>0}));
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              for(const id of ['about','session','events','join'])assert.equal(await page.locator('#'+id).count(),1);
              assert.equal(await page.locator('time').count(),2);
              await page.locator('#gallery').scrollIntoViewIfNeeded();
              await page.locator('#gallery img').evaluateAll(imgs=>Promise.all(imgs.map(i=>{i.loading='eager';return i.decode()})));
              assert.equal(await page.locator('#gallery img').count(),4);
              assert.equal(errors.length,0);
              await page.screenshot({path:'screenshots/home-'+width+'.png',fullPage:true});
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots/

      - name: Assemble release candidate without publishing
        run: |
          mkdir -p release/assets
          cp index.html style.css robots.txt sitemap.xml release/
          cp assets/*.webp release/assets/
          cd release
          sha256sum index.html style.css robots.txt sitemap.xml assets/*.webp > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
