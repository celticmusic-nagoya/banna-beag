name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: Successful Browser QA run ID for current main SHA
        required: true
        type: string
      confirm:
        description: Type PUBLISH to authorize public deployment
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Validate QA provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qa_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .head_branch == "main" and .name == "Browser QA" and .conclusion == "success"'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          run-id: ${{ inputs.qa_run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify release
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          test -s index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
      - uses: actions/deploy-pages@v4
        id: deploy
