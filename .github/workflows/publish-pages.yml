name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      qa_run_id:
        description: Successful Browser QA run ID for current main SHA
        required: true
        type: string
      confirm:
        description: Type PUBLISH to authorize public deployment
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Validate QA provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qa_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg sha "$GITHUB_SHA" '.head_sha == $sha and .head_branch == "main" and .name == "Browser QA" and .conclusion == "success"'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          run-id: ${{ inputs.qa_run_id }}
          github-token: ${{ github.token }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          run-id: ${{ inputs.qa_run_id }}
          github-token: ${{ github.token }}
          path: lighthouse
      - name: Enforce quality thresholds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          categories=json.loads(Path('lighthouse/mobile.json').read_text())['categories']
          for key, minimum in {'performance':90,'accessibility':95,'best-practices':95,'seo':95}.items():
              score=categories[key]['score']*100
              print(key, score, minimum)
              assert score >= minimum, f'{key}: below release threshold'
          PY
      - name: Verify release
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          test -s index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release
      - name: Wait for Pages artifact to become visible to the deployment API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') || count=0
            if [ "$count" = "1" ]; then
              echo "Exactly one github-pages artifact is indexed"
              sleep 5
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Duplicate github-pages artifacts detected"
              exit 1
            fi
            echo "Attempt $attempt: artifact not indexed; retrying"
            sleep 5
          done
          echo "::error::Pages artifact did not become visible"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
